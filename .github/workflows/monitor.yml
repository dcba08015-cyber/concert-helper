name: 釋票監控
on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分鐘檢查一次；上一輪還在跑就排隊，確保一輪結束馬上接下一輪
  workflow_dispatch:
concurrency:
  group: ticket-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node monitor.js
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          NEED: '2'
          INTERVAL_SEC: '3'
          RUN_MINUTES: '340'
